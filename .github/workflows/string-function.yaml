name: string-function
on: push

jobs:
  string-function:
    runs-on: ubuntu-latest

    steps:
      - name: startsWith_true
        if: startsWith('github actions', 'git') # git으로 시작하므로 true
        run: echo 'git'
      
      - name: startsWith_false
        if: startsWith('github actions', 'test') # test로 시작하지 않으므로 false
        run: echo 'test' # 실행 X

      - name: endsWith_true
        if: endsWith('github actions', 'ions') # ions로 끝나므로 true
        run: echo 'ions'

      - name: endsWith_false
        if: endsWith('github actions', 'test') # test로 끝나지 않으므로 false
        run: echo 'test' # 실행 X

      - name: contains_string
        if: contains('github actions', 'act') # act를 포함하므로 true
        run: echo 'act'

      - name: contains_arr
        if: contains(fromJSON('[12, 14, 16]'), 12) # arry로 입력받은 [12, 14, 16]에 12가 포함되어있으므로 true
        run: echo '12'