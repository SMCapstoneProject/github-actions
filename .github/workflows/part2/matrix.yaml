name: matrix
on: push

jobs:
  get-matrix:
    # matrix 선언
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        version: [12, 14]
    runs-on: ${{ matrix.os}} # runner가 matrix.os값에 따라 동적으로 결정됨

    steps:
    - name: check matrix
      run: |
        echo ${{ matrix.os }}
        echo ${{ matrix.version }}