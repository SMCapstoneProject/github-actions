name: needs
on: push

# 실행시킬 job의 집합
jobs:
  # 1번째로 수행될 job
  First-job:
    runs-on: ubuntu-latest
    steps:
      - name: First-echo
        run: echo "First echo done"

  Second-job:
    runs-on: ubuntu-latest
    needs: [First-job] # 해당 job이 완료된 후 실행
    steps:
      - name: Second-echo
        run: echo "Second echo done"

  # 해당 job은 강제로 실패되도록 설계
  Third-job:
    runs-on: ubuntu-latest
    steps:
      - name: Third-Fail
        run: |
          echo "excute Fail"
          exit 1

  Forth-job:
      runs-on: ubuntu-latest
      needs: [Third-job] # 해당 job이 완료된 후 실행 -> Forth job또한 실행 X
      steps:
        - name: Forth-echo
          run: echo "Forth echo done"