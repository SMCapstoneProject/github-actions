name: cache

on:
  push:
    paths:
    - 'my-app/**' # my-app/ 디렉토리 하위의 어떤 파일이 변경되어도 워크플로우가 실행됨

jobs:
  # 이 워크플로우는 'cache'라는 이름의 job 하나를 가짐
  cache:
    runs-on: ubuntu-latest

    steps:
    # 1. 소스 코드 체크아웃
    - name: checkout
      uses: actions/checkout@v4 # GitHub 레포지토리의 소스 코드를 가상 머신으로 내려받는 액션

    # 2. Node.js 환경 설정
    - name: setup-node
      uses: actions/setup-node@v3 # Node.js를 설치하고 설정해주는 액션
      with: # with는 해당 액션에 필요한 옵션을 전달하는 부분
        node-version: 18 # Node.js 18 버전을 설치
    
    # 3. NPM 의존성 캐싱 설정
    - name: Cache Node.js modules
      uses: actions/cache@v3 # 파일이나 디렉토리를 캐싱하여 다음 워크플로우 실행 속도를 높이는 액션
      with:
        # 캐싱할 디렉토리 경로. ~/.npm은 npm의 글로벌 캐시 폴더로, 패키지 다운로드 속도를 향상시킴
        path: ~/.npm

        # 캐시를 식별하기 위한 고유 키. 운영체제, 'node', package-lock.json 파일의 해시값으로 구성됨
        # package-lock.json이 변경되면 키가 바뀌어 새로운 캐시를 생성함
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        
        # key와 정확히 일치하는 캐시가 없을 경우, 이 키 패턴으로 시작하는 이전 캐시를 대신 사용함 (예: 이전 버전의 캐시)
        restore-keys: |
          ${{ runner.os }}-node-
    
    # 4. 의존성 설치
    - name: Install dependencies
      # 실제 명령어를 실행하는 부분
      # package-lock.json을 기반으로 의존성을 빠르게 설치 (CI 환경에 권장)
      run: |
        cd my-app
        npm ci

    # 5. 리액트 앱 빌드
    - name: npm build
      # package.json에 정의된 build 스크립트를 실행하여 프로젝트를 빌드함
      run: |
        cd my-app
        npm run build