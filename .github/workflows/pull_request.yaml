name: pull-request-workflow # 생략해도 상관없으나 액션창에서 표현될 시각화 이름으로서 명시하는것이 좋음
on: 
  pull_request: # push이벤트에 의해 트리거 됨
    types: [opened] # 그중에서도 풀 리퀘스트가 생성된 시점에서만 트리거

# 실행시킬 job의 집합
jobs:
  pull_request-job:
    runs-on: ubuntu-latest # ubuntu를 Runner로 지정
    steps:
      - name: step1 # 마찬가지로 생략 가능
        run: echo hello MTE world!

      - name: step2 
        run: | # 멀티 라인커맨드 실행
          echo Debug1
          echo Debug2